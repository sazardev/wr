<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Design — wr</title>
<meta name="description" content="The design system of the wr docs site: flat, terminal, braille, six palettes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2307090d'/%3E%3Ctext x='50' y='74' font-size='66' text-anchor='middle' fill='%234da3ff' font-family='monospace'%3E%E2%A3%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-guide">
<canvas id="field" aria-hidden="true"></canvas>

<header class="site-head">
  <a class="brand" href="./"><span class="b">⣿</span> wr <small>0.2.1</small></a>
  <nav>
    <a href="./">Home</a>
    <a href="guide.html">Guide</a>
    <a href="design.html" class="active">Design</a>
    <a href="https://github.com/sazardev/wr">GitHub</a>
    <a href="https://github.com/sazardev/wr/releases">Releases</a>
  </nav>
  <div class="themes" id="themes">
    <span class="label">⣀ theme</span>
  </div>
</header>

<main class="wrap guide-wrap">
  <aside class="toc">
    <div class="toc-title">⣿ SECTIONS</div>
    <nav id="toc-nav"></nav>
  </aside>
  <article id="doc" class="doc">
    <p class="loading">⠋ loading the design…</p>
  </article>
</main>

<section class="wrap" style="padding-top:6px">
  <div class="sec-head"><span class="glyph">⣤</span><h2>THE UI, RECORDED</h2></div>
  <div class="rule-b" data-fill="22"></div>
  <div class="demos" id="demo-grid">
    <figure class="demo"><img src="assets/scenes/ui.svg" alt="wr open on an article: reading view with a code block" loading="lazy">
      <figcaption class="cap"><b>ui</b><span class="k">o</span> open an address, read the article</figcaption></figure>
    <figure class="demo"><img src="assets/scenes/links.svg" alt="wr with every link labelled with a short hint" loading="lazy">
      <figcaption class="cap"><b>links</b><span class="k">f</span> label every link, type a hint</figcaption></figure>
    <figure class="demo"><img src="assets/scenes/sections.svg" alt="wr section index with the headings of the page" loading="lazy">
      <figcaption class="cap"><b>sections</b><span class="k">t</span> the heading index</figcaption></figure>
    <figure class="demo"><img src="assets/scenes/shortcuts.svg" alt="wr menu with the shortcuts of the program" loading="lazy">
      <figcaption class="cap"><b>shortcuts</b><span class="k">m</span> the menu</figcaption></figure>
  </div>
</section>

<footer class="site-foot">
  <div class="hints">
    <a href="./"><span class="k">⣿</span> home</a>
    <a href="design.html"><span class="k">⡇</span> guide</a>
    <a href="design.html"><span class="k">⣷</span> design</a>
    <a href="https://github.com/sazardev/wr"><span class="k">⡇</span> github</a>
    <a href="https://github.com/sazardev/wr/issues"><span class="k">⣶</span> issues</a>
  </div>
  <div class="foot-right">
    <span id="progress" aria-hidden="true"></span>
    <span id="pct">0%</span>
  </div>
</footer>

<script src="braille.js"></script>
<script src="markdown.js"></script>
<script>
(async () => {
  const doc = document.getElementById('doc');
  try {
    const res = await fetch("DESIGN.md");
    if (!res.ok) throw new Error('HTTP ' + res.status);
    doc.innerHTML = renderMarkdown(await res.text());
    buildTOC(doc, document.getElementById('toc-nav'));
  } catch (err) {
    doc.innerHTML = '<p class="load-error">⠋ could not load DESIGN.md (' + err.message +
      '). Read it on <a href="https://github.com/sazardev/wr/blob/main/docs/GUIDE.md">GitHub</a>.</p>';
  }
})();
</script>
</body>
</html>
