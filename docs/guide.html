<header class="site-head">
  <a class="brand" href="./"><span class="b">⣿</span> wr</a>
  <nav>

<main class="guide-wrap">
  <aside class="toc">
    <div class="toc-title">⣿ SECTIONS</div>
    <nav id="toc-nav"></nav>
  </aside>
  <article id="doc" class="doc">
    <p class="loading">⠋ loading the guide…</p>
  </article>
</main>

<footer class="site-foot">
  <div class="hints">
    <a href="./"><span class="k">⣿</span> home</a>
    <a href="https://github.com/sazardev/wr"><span class="k">⡇</span> github</a>

  </div>
  <div class="foot-right">
    <span id="progress" aria-hidden="true"></span>
    <span id="pct">0%</span>
  </div>
</footer>

<script src="braille.js"></script>
<script src="markdown.js"></script>
<script>
(async () => {
  const doc = document.getElementById('doc');
  try {
    const res = await fetch('GUIDE.md');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    doc.innerHTML = renderMarkdown(await res.text());
    buildTOC(doc, document.getElementById('toc-nav'));
  } catch (err) {
    doc.innerHTML = '<p class="load-error">⠋ could not load GUIDE.md (' + err.message +
      '). Read it on <a href="https://github.com/sazardev/wr/blob/main/docs/GUIDE.md">GitHub</a>.</p>';
  }
})();
</script>
</body>
</html>
