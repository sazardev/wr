version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      # @astrojs/check only accepts TypeScript ^5 || ^6; TypeScript 7 fails
      # `npm ci` with ERESOLVE. Remove this when @astrojs/check supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
