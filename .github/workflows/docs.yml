name: Docs

# The documentation site (web/, an Astro app) is built here and published to
# Cloudflare Pages at https://wr.sazardev.stream. On a pull request it only
# verifies: astro check, the unit tests and a production build. On main it also
# deploys: `wrangler pages deploy` uploads web/dist directly.
#
# The version stamped into the site comes from .release-please-manifest.json —
# the same file release-please bumps on every release — so the docs publish the
# version they were built from without anyone touching a number.
#
# Required repository secret:
#   CLOUDFLARE_API_TOKEN — an API token with "Cloudflare Pages: Edit" on the
#   account. The account id is public and set below.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://wr.sazardev.stream
      SITE_BASE: /
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Read the version release-please is at
        run: echo "WR_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
        working-directory: web
      - name: Types (astro check)
        run: npm run check
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  deploy:
    name: deploy to Cloudflare Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: https://wr.sazardev.stream
      SITE_BASE: /
      CLOUDFLARE_ACCOUNT_ID: 92b877a97b5acbd48f6d7dcf60129130
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Read the version release-please is at
        run: echo "WR_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Publish to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4.163.0 pages deploy dist --project-name wr --branch main
        working-directory: web
      - name: Cloudflare token not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Set the CLOUDFLARE_API_TOKEN repository secret (Cloudflare Pages Edit permission) so pushes publish automatically. The site was not uploaded."
      - name: Tell search engines about the new pages (IndexNow)
        run: node scripts/indexnow.mjs "https://wr.sazardev.stream"
        working-directory: web
        continue-on-error: true
