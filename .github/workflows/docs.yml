name: Docs

# The documentation site (web/, an Astro app) is built and published to GitHub
# Pages from this workflow. On a pull request it only verifies: astro check, the
# unit tests and a production build. On main it also deploys.
#
# The version stamped into the site comes from .release-please-manifest.json —
# the same file release-please bumps on every release — so the docs publish the
# version they were built from without anyone touching a number.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Read the version release-please is at
        run: echo "WR_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
        working-directory: web
      - name: Types (astro check)
        run: npm run check
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  deploy:
    name: deploy
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Read the version release-please is at
        run: echo "WR_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
